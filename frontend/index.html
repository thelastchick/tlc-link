<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TLC LINK — The Last Chick</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <canvas id="space-canvas"></canvas>
  <div class="nebula-overlay"></div>

  <div class="app-shell" id="app-shell">
    <nav class="menu-strip" aria-label="App menus">
      <div class="menu-wrap">
        <button class="menu-trigger" aria-expanded="false" type="button" data-i18n="menuFile">File ▾</button>
        <div class="menu-pop">
          <button class="menu-item" data-act="import" type="button" data-i18n="menuImport">Import Config…</button>
          <button class="menu-item" data-act="paste" type="button" data-i18n="menuPaste">Import from Clipboard</button>
          <button class="menu-item" data-act="file" type="button" data-i18n="menuFileImport">Import from File…</button>
          <div class="menu-sep"></div>
          <button class="menu-item" data-act="export" type="button" data-i18n="menuExport">Export Selected Config</button>
          <button class="menu-item" data-act="backup" type="button" data-i18n="menuBackup">Backup Profiles…</button>
          <button class="menu-item" data-act="restore" type="button" data-i18n="menuRestore">Restore Backup…</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-trigger" aria-expanded="false" type="button" data-i18n="menuSettings">Settings ▾</button>
        <div class="menu-pop">
          <button class="menu-item" data-act="preferences" type="button" data-i18n="menuPreferences">Preferences…</button>
          <button class="menu-item" data-act="profilemanager" type="button" data-i18n="menuProfileManager">Profile Manager</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-trigger" aria-expanded="false" type="button" data-i18n="menuTools">Tools ▾</button>
        <div class="menu-pop">
          <button class="menu-item" data-act="ping" type="button" data-i18n="menuPingAll">Ping All</button>
          <button class="menu-item" data-act="logs" type="button" data-i18n="menuJumpLogs">Jump to Logs</button>
          <button class="menu-item" data-act="clipboard" type="button" data-i18n="menuCheckClipboard">Check Clipboard</button>
          <button class="menu-item" data-act="netreset" type="button" data-i18n="menuNetReset">Emergency Network Reset</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="menu-trigger" aria-expanded="false" type="button" data-i18n="menuHelp">Help ▾</button>
        <div class="menu-pop">
          <button class="menu-item" data-act="guide" type="button" data-i18n="menuGuide">Quick Guide / About</button>
          <button class="menu-item" data-act="website" type="button" data-i18n="menuWebsite">The Last Chick Website</button>
        </div>
      </div>
      <span class="menu-status" data-i18n="menuStatus">TLC LINK · Profile client</span>
    </nav>

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand-block">
        <div class="brand-badge">TLC</div>
        <div class="brand-titles">
          <h1>TLC LINK</h1>
          <span id="brand-tagline" data-i18n="tagline"></span>
        </div>
      </div>

      <div class="top-controls">
        <select id="core-select" class="lang-select" aria-label="VPN Core" data-i18n-title="coreSelectTitle">
          <option value="sing-box">sing-box</option>
          <option value="xray">Xray</option>
        </select>

        <!-- 9 Languages: Persian (fa) is the 4th option -->
        <select id="lang-select" class="lang-select" aria-label="Language Selector" data-i18n-title="langSelectTitle">
          <option value="en">🇺🇸 English</option>
          <option value="zh">🇨🇳 中文 (Chinese)</option>
          <option value="ko">🇰🇷 한국어 (Korean)</option>
          <option value="fa" selected>🇮🇷 فارسی</option>
          <option value="ja">🇯🇵 日本語 (Japanese)</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="tr">🇹🇷 Türkçe</option>
        </select>

        <button class="btn btn-outline-gold" id="btn-open-qr" type="button">
          <span>📷</span>
          <span id="lbl-qr-btn" data-i18n="qrBtn"></span>
        </button>

        <button class="btn btn-gold" id="btn-open-import" type="button">
          <span>＋</span>
          <span id="lbl-import-btn" data-i18n="importBtn"></span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left Sidebar: Subscriptions, Routing Modes, TUN & Kill Switch -->
      <aside class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>📡</span>
            <span id="lbl-subs-title" data-i18n="subsTitle"></span>
          </div>
          <button class="mini-btn" id="btn-add-sub" type="button" data-i18n-title="addSubTitle">＋</button>
        </div>

        <div class="sub-list" id="sub-list"></div>

        <div class="panel-header" style="margin-top: 6px;">
          <div class="panel-title">
            <span>🔀</span>
            <span id="lbl-routing-title" data-i18n="routingTitle"></span>
          </div>
        </div>

        <div class="routing-group">
          <button class="mode-btn active" data-mode="rule" id="mode-rule" type="button" data-i18n="modeRule">Rule</button>
          <button class="mode-btn" data-mode="global" id="mode-global" type="button" data-i18n="modeGlobal">Global</button>
          <button class="mode-btn" data-mode="direct" id="mode-direct" type="button" data-i18n="modeDirect">Direct</button>
        </div>

        <div class="toggle-row">
          <div>
            <span class="toggle-label" id="lbl-tun" data-i18n="tun"></span>
            <span class="toggle-sub" id="lbl-tun-sub" data-i18n="tunSubFull"></span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-tun">
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div>
            <span class="toggle-label" id="lbl-ks" data-i18n="ks"></span>
            <span class="toggle-sub" id="lbl-ks-sub" data-i18n="ksSubFull"></span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-ks" disabled aria-disabled="true">
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div>
            <span class="toggle-label" id="lbl-dns" data-i18n="dns"></span>
            <span class="toggle-sub" id="lbl-dns-sub" data-i18n="dnsSubFull"></span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-dns">
            <span class="slider"></span>
          </label>
        </div>
      </aside>

      <!-- Center Column: Server Profiles + Live Logs -->
      <div class="center-column">
        <section class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <span>🖥️</span>
              <span id="lbl-servers-title" data-i18n="serversTitle"></span>
            </div>
            <span class="pill-count" id="server-count-badge">0</span>
          </div>

          <div class="toolbar-actions">
            <button class="btn btn-outline-gold" id="btn-paste-clip" type="button">📋 <span id="lbl-clip" data-i18n="clip"></span></button>
            <button class="btn" id="btn-import-file" type="button">📄 <span id="lbl-file" data-i18n="file"></span></button>
            <input type="file" id="file-input" accept=".txt,.json,.yaml,.yml,.conf,.sub" style="display:none;" />
            <button class="btn" id="btn-ping-all" type="button">⚡ <span id="lbl-ping" data-i18n="ping"></span></button>
            <button class="btn btn-danger-soft" id="btn-clear-servers" type="button">🗑️ <span id="lbl-clear" data-i18n="clear"></span></button>
          </div>

          <div class="proto-badges">
            <span class="proto-chip">VLESS</span>
            <span class="proto-chip">VMess</span>
            <span class="proto-chip">Trojan</span>
            <span class="proto-chip">Shadowsocks</span>
            <span class="proto-chip">Hysteria2</span>
            <span class="proto-chip">TUIC</span>
            <span class="proto-chip">SOCKS5</span>
            <span class="proto-chip">WireGuard</span>
            <span class="proto-chip">sing-box JSON</span>
            <span class="proto-chip" data-i18n="protoSub">Subscription</span>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th id="th-name" data-i18n="thName"></th>
                  <th id="th-proto" data-i18n="thProto"></th>
                  <th id="th-addr" data-i18n="thAddr"></th>
                  <th id="th-ping" data-i18n="thPing"></th>
                  <th id="th-qr" data-i18n="thQr"></th>
                </tr>
              </thead>
              <tbody id="server-tbody"></tbody>
            </table>
          </div>
        </section>

        <details class="panel logs-panel" id="logs-panel">
          <summary class="logs-header">
            <span class="logs-toggle"><span class="logs-chevron">▸</span><span>📜</span><span id="lbl-logs-title" data-i18n="logsTitle"></span><span class="logs-count" id="logs-count">0</span></span>
            <span class="logs-actions"><button class="mini-btn" id="btn-copy-logs" type="button" data-i18n="logsCopy"></button><button class="mini-btn" id="btn-clear-logs" type="button" data-i18n="logsClear"></button></span>
          </summary>
          <div class="log-box" id="log-box" aria-live="polite"></div>
        </details>
      </div>

      <!-- Right Column: Chick Lantern Connection + Build Status -->
      <div class="right-column">
        <section class="panel connect-card">
          <div class="status-badge" id="status-badge">
            <span class="status-dot"></span>
            <span id="lbl-status-text"></span>
          </div>
          <div class="traffic-meters" id="traffic-meters" hidden>
            <div class="traffic-row"><span class="traffic-label" data-i18n="trafficDown">↓</span> <span id="traffic-down">—</span></div>
            <div class="traffic-row"><span class="traffic-label" data-i18n="trafficUp">↑</span> <span id="traffic-up">—</span></div>
            <div class="traffic-totals"><span id="traffic-totals">—</span></div>
          </div>

          <div class="chick-stage" id="chick-stage">
            <div class="chick-aura"></div>

          <div class="active-server-box" id="active-server-summary">—</div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <span>🛠️</span>
              <span id="lbl-build-title" data-i18n="buildTitle"></span>
            </div>
          </div>
          <div class="readiness-list" id="readiness-list">
            <div class="readiness-item">
              <span data-i18n="readyLangs"></span>
              <span class="badge-ready" data-i18n="badgeReady"></span>
            </div>
            <div class="readiness-item">
              <span data-i18n="readyProtos"></span>
              <span class="badge-ready" data-i18n="badgeReady"></span>
            </div>
            <div class="readiness-item">
              <span data-i18n="readyQr"></span>
              <span class="badge-ready" data-i18n="badgeReady"></span>
            </div>
            <div class="readiness-item">
              <span data-i18n="readyTun"></span>
              <span class="badge-pending" data-i18n="badgePending"></span>
            </div>
            <div class="readiness-item">
              <span data-i18n="readyNodes"></span>
              <span class="badge-pending" data-i18n="badgePending"></span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div>
        <strong style="color: var(--gold);">TLC LINK</strong> — <span id="lbl-footer-brand" data-i18n="footerBrand"></span>
      </div>
      <div>
        <a href="https://www.thelastchick.com/" target="_blank" rel="noopener noreferrer">www.thelastchick.com</a>
      </div>
    </footer>
  </div>

  <!-- Modal: Preferences -->
  <div class="modal-backdrop" id="modal-prefs">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="prefsTitle">Preferences</h3>
        <button class="close-x" data-close="modal-prefs" type="button">&times;</button>
      </div>
      <div class="prefs-grid">
        <label class="prefs-row">
          <span><span data-i18n="prefClipLabel">Clipboard monitor</span><small data-i18n="prefClipDesc">Check clipboard on app focus; suggest import for detected links.</small></span>
          <input id="pref-clipboard" type="checkbox">
        </label>
        <label class="prefs-row">
          <span><span data-i18n="prefStartupLabel">Start with Windows</span><small data-i18n="prefStartupDesc">Saved preference only; OS startup hook is not active yet.</small></span>
          <input id="pref-startup" type="checkbox">
        </label>
        <label class="prefs-row">
          <span><span data-i18n="prefTrayLabel">Close to system tray</span><small data-i18n="prefTrayDesc">When enabled, closing the window hides near the clock. Exit from the tray menu to quit.</small></span>
          <input id="pref-tray" type="checkbox">
        </label>
        <label class="prefs-row">
          <span data-i18n="prefConfirmClear">Confirm before clearing profiles</span>
          <input id="pref-confirm-clear" type="checkbox" checked>
        </label>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px">
        <button class="btn btn-gold" id="save-prefs" type="button" data-i18n="btnSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Modal: Quick Guide / About -->
  <div class="modal-backdrop" id="modal-guide">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="guideTitle">About TLC LINK / Quick Guide</h3>
        <button class="close-x" data-close="modal-guide" type="button">&times;</button>
      </div>
      <p style="font-size:13px;line-height:1.7" id="guide-body" data-i18n="guideBody"></p>
    </div>
  </div>

  <input id="backup-picker" type="file" accept=".json,application/json" hidden>

  <!-- Modal: Import Configs -->
  <div class="modal-backdrop" id="modal-import">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-import-title" data-i18n="importModalTitle"></h3>
        <button class="close-x" data-close="modal-import" type="button">&times;</button>
      </div>
      <p style="font-size: 11.5px; color: var(--text-secondary); margin-bottom: 8px;" id="modal-import-desc" data-i18n="importModalDesc"></p>
      <textarea class="cfg-input" id="import-textarea" placeholder="vless://...&#10;vmess://...&#10;trojan://...&#10;ss://...&#10;hysteria2://...&#10;https://example.com/sub"></textarea>
      <div style="display:flex; justify-content:flex-start; gap:8px; margin:8px 0 12px;">
        <button class="btn btn-outline-gold" id="btn-paste-import-text" type="button" data-i18n="btnPaste">📋 Paste</button>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" data-close="modal-import" type="button" data-i18n="btnCancel"></button>
        <button class="btn btn-gold" id="btn-confirm-import" type="button" data-i18n="btnSaveProfile"></button>
      </div>
    </div>
  </div>

  <!-- Modal: QR Code Scan & Generate -->
  <div class="modal-backdrop" id="modal-qr">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-qr-title" data-i18n="qrModalTitle"></h3>
        <button class="close-x" data-close="modal-qr" type="button">&times;</button>
      </div>
      <div class="qr-preview-box">
        <canvas id="qr-canvas" width="176" height="176"></canvas>
        <div id="qr-payload-text" class="mono" style="font-size: 10.5px; color: var(--text-secondary); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;">
        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline-gold" id="btn-qr-upload" type="button" data-i18n="btnQrUpload"></button>
          <input type="file" id="qr-file-input" accept="image/*" style="display:none;" />
          <button class="btn" id="btn-qr-paste-img" type="button" data-i18n="btnQrPasteImg"></button>
        </div>
        <button class="btn btn-gold" id="btn-qr-connect-now" type="button" data-i18n="btnQrConnect"></button>
      </div>
    </div>
  </div>

  <!-- Modal: Add Subscription -->
  <div class="modal-backdrop" id="modal-sub">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="subModalTitle"></h3>
        <button class="close-x" data-close="modal-sub" type="button">&times;</button>
      </div>
      <input type="text" class="text-input" id="new-sub-name" data-i18n-placeholder="subNamePlaceholder" placeholder="" />
      <input type="text" class="text-input" id="new-sub-url" data-i18n-placeholder="subUrlPlaceholder" placeholder="" />
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" data-close="modal-sub" type="button" data-i18n="btnCancel"></button>
        <button class="btn btn-gold" id="btn-save-sub" type="button" data-i18n="btnAdd"></button>
      </div>
    </div>
  </div>

  <!-- Real QR utilities: local vendored scripts (offline). -->
  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>

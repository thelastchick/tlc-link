[package]
name = "tlc-link"
version = "0.2.0-rc.1"
description = "TLC LINK desktop VPN client"
authors = ["The Last Chick"]
edition = "2021"
default-run = "tlc-link"

# main.rs calls `tlc_link_lib::run()`; Tauri 2 requires the library target to be declared explicitly.
[lib]
name = "tlc_link_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# Registry, Job Objects, process identity, and Windows Filtering Platform (Kill Switch).
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_System_Rpc",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
] }

[[bin]]
name = "tlc-link"
path = "src/main.rs"

[[bin]]
name = "tlc-ks-service"
path = "src/bin/tlc_ks_service.rs"
